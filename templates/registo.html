{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4">

            {# Título principal do formulário de registo #}
            <h2 class="mb-4 text-center fw-bold">Criar Conta</h2>

            {# Formulário de registo para novos clientes #}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Endereço de Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Palavra-passe</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                {# Botão de submissão do registo #}
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Registar</button>
            </form>

            {# Ligação de redirecionamento para clientes que já possuem conta #}
            <p class="text-center mt-3 text-muted">Já tens conta? <a href="{{ url_for('login') }}">Entrar</a></p>
        </div>
    </div>
</div>
{% endblock %}
